name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    # Linux is enough for lint + unit tests (no MLX, no models) and costs 1/10 of macOS minutes.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
      - name: ruff
        run: |
          uvx ruff@0.17.0 check src tests
          uvx ruff@0.17.0 format --check src tests
      - name: shellcheck
        run: shellcheck start.sh uninstall.sh .githooks/pre-commit
      # The project's locked dependencies (Linux wheels; MLX installs but cannot run, so
      # transcription tests stop at the missing model) plus the dev group (pytest). Tests
      # that need macOS `say` or ffmpeg are skipped (marker `media`).
      - name: unit tests
        run: |
          uv sync --frozen --python 3.12
          uv run --frozen python -m pytest -q

  app:
    # The local app's UI (app/): unit tests and the production build, with the node version
    # pinned in manifest/tools.json (keep the two in step).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: app tests and build
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

[project]
name = "videocut"
version = "0.0.1"
description = "Local, agent-driven video editing: Claude cuts your talking-head recordings into finished short videos."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Florian Koerber" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "huggingface-hub>=0.26",
  "mediapipe>=0.10.21",
  "mlx-whisper>=0.4.2",
  "numpy>=1.26",
  "parakeet-mlx>=0.3",
]

[project.scripts]
videocut = "videocut.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videocut"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
